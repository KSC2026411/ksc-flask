{% extends "public/base_public.html" %}
{% block title %}Announcement{% endblock %}
{% block content %}
<div class="container mt-5 mb-5">
<div class="card shadow p-4">
<h2>{{ announcement.title }}</h2>
<p class="text-muted">{{ announcement.created_at.strftime('%B %d, %Y') }}</p>
<hr>
<p style="white-space:pre-line;">{{ announcement.message }}</p>
<a href="{{ url_for('main.home') }}" class="btn btn-primary">Back Home</a>
</div>
</div>
{% endblock %}
