{% extends "public/base_public.html" %}
{% block title %}Change Password{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<style>
.auth-card{
width:100%;
max-width:430px;
background:white;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.18);
overflow:hidden;
}
.auth-header{
background:linear-gradient(135deg,#0d6efd,#6610f2);
color:white;
text-align:center;
padding:30px 20px;
}
.lock-icon{
font-size:45px;
margin-bottom:10px;
}
.auth-body{
padding:35px;
}
.form-control{
height:48px;
border-radius:10px;
}
.btn-update{
height:48px;
border-radius:10px;
font-weight:600;
transition:.3s;
}
.btn-update:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(13,110,253,.35);
}
</style>
<div class="d-flex justify-content-center align-items-center min-vh-100">
<div class="auth-card">
<div class="auth-header">
<div class="lock-icon">🔒</div>
<h3 class="mb-1">Create New Password</h3>
<p class="mb-0">Secure your account before continuing</p>
</div>
<div class="auth-body">
<form method="POST">
<div class="mb-4">
<label class="form-label fw-semibold">New Password</label>
<div class="input-group">
<input type="password" id="password" name="password" class="form-control" placeholder="Enter new password" required minlength="6">
<button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">👁</button>
</div>
</div>
<button type="submit" class="btn btn-primary w-100 btn-update">Update Password</button>
</form>
</div>
</div>
</div>
<script>
function togglePassword(){
let password=document.getElementById("password");
password.type=password.type==="password"?"text":"password";
}
</script>
{% endblock %}
