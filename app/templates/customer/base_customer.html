<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}KSC LOGISTICS - Customer{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
html{font-size:18px!important}
body{background:#f4f6f9;color:#172033;font-size:18px!important;line-height:1.6}
.top-action-bar{background:#0b1f3a;min-height:82px;z-index:1050;padding-left:18px!important;padding-right:18px!important}
.top-nav-buttons{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.top-nav-buttons::-webkit-scrollbar{display:none}
.top-action-bar .btn{white-space:nowrap;border-radius:10px;font-size:18px!important;font-weight:600;padding:12px 18px}
.brand-name{color:#fff;font-size:22px!important;font-weight:700;margin-right:8px;white-space:nowrap}
.customer-main{width:100%;max-width:1900px;margin:0 auto;padding:45px 50px 70px}
.customer-main h1{font-size:40px!important;font-weight:700;line-height:1.2}
.customer-main h2{font-size:36px!important;font-weight:700;line-height:1.2}
.customer-main h3{font-size:30px!important;font-weight:700;line-height:1.25}
.customer-main h4{font-size:25px!important;font-weight:700}
.customer-main h5{font-size:21px!important;font-weight:600}
.customer-main p{font-size:18px!important}
.customer-main label{font-size:18px!important}
.customer-main .text-muted{font-size:17px!important;color:#596575!important}
.customer-main .card{border-radius:14px;border:1px solid #dce2e9}
.customer-main .card-header{padding:18px 22px;font-size:20px!important}
.customer-main .card-body{padding:24px}
.customer-main .table{font-size:18px!important}
.customer-main .table th{font-size:18px!important;font-weight:700;color:#253044;padding:16px}
.customer-main .table td{font-size:18px!important;padding:16px;vertical-align:middle}
.customer-main .badge{font-size:16px!important;padding:8px 12px}
.customer-main .btn{font-size:18px!important;font-weight:600;border-radius:9px;padding:11px 18px}
.customer-main .btn-lg{font-size:20px!important;padding:14px 24px}
.customer-main .form-label{font-size:18px!important;font-weight:600;margin-bottom:8px}
.customer-main .form-control,.customer-main .form-select{font-size:18px!important;min-height:54px;border-radius:9px;padding:12px 14px}
.customer-main textarea.form-control{min-height:130px}
.customer-main .form-text{font-size:16px!important}
.mobile-navbar{background:#0b1f3a;min-height:70px;padding-top:10px!important;padding-bottom:10px!important}
.mobile-navbar .navbar-brand{font-size:21px!important;font-weight:700}
.mobile-navbar .navbar-toggler{padding:8px 10px;border-radius:8px}
#mobileMenu{background:#0b1f3a}
#mobileMenu a{font-size:18px!important}
#mobileMenu .btn{font-size:18px!important}
#mobileMenu>div{padding:18px!important}
.customer-page{min-height:100vh}
@media(max-width:1199.98px){
.customer-main{padding:35px 30px 55px}
}
@media(max-width:991.98px){
html{font-size:17px!important}
body{font-size:17px!important}
.customer-main{padding:30px 22px 50px}
.customer-main h1{font-size:34px!important}
.customer-main h2{font-size:31px!important}
.customer-main h3{font-size:27px!important}
.customer-main p{font-size:17px!important}
.customer-main .table,.customer-main .table th,.customer-main .table td{font-size:17px!important}
}
@media(max-width:575.98px){
html{font-size:16px!important}
body{font-size:16px!important}
.customer-main{width:100%;max-width:none;margin:0;padding:24px 10px 45px!important}
.customer-main h1{font-size:29px!important}
.customer-main h2{font-size:27px!important}
.customer-main h3{font-size:24px!important}
.customer-main h4{font-size:21px!important}
.customer-main h5{font-size:19px!important}
.customer-main p{font-size:16px!important}
.customer-main .text-muted{font-size:15px!important}
.customer-main .card-body{padding:18px}
.customer-main .table,.customer-main .table th,.customer-main .table td{font-size:16px!important}
.customer-main .btn{font-size:16px!important}
.customer-main .form-control,.customer-main .form-select,.customer-main .form-label{font-size:16px!important}
.mobile-navbar{min-height:70px;padding-left:14px!important;padding-right:14px!important}
.mobile-navbar .navbar-brand{font-size:21px!important}
}
</style>
</head>
<body class="customer-page {% block body_class %}{% endblock %}">
<div class="d-none d-lg-flex align-items-center justify-content-between px-3 py-2 shadow-sm top-action-bar fixed-top">
<div class="d-flex align-items-center gap-2 top-nav-buttons">
<div class="brand-name"><i class="bi bi-box-seam me-1"></i>KSC Logistics</div>
<a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-light d-flex align-items-center gap-1"><i class="bi bi-house-door"></i><span>Dashboard</span></a>
<a href="{{ url_for('main.schedule') }}" class="btn btn-primary d-flex align-items-center gap-1"><i class="bi bi-calendar-plus"></i><span>Schedule Pickup</span></a>
<a href="{{ url_for('main.track') }}" class="btn btn-success d-flex align-items-center gap-1"><i class="bi bi-truck"></i><span>Track Shipment</span></a>
<a href="{{ url_for('main.my_packages') }}" class="btn btn-info d-flex align-items-center gap-1"><i class="bi bi-box-seam"></i><span>My Packages</span></a>
<a href="{{ url_for('main.customer_analytics') }}" class="btn btn-secondary d-flex align-items-center gap-1"><i class="bi bi-bar-chart"></i><span>Analytics</span></a>
</div>
<div class="d-flex align-items-center gap-2">
<button type="button" onclick="window.location.reload();" class="btn btn-warning d-flex align-items-center gap-1"><i class="bi bi-arrow-clockwise"></i><span>Refresh</span></button>
<a href="{{ url_for('main.logout') }}" class="btn btn-danger d-flex align-items-center gap-1"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
</div>
</div>
<div class="d-none d-lg-block" style="height:82px;"></div>
<nav class="navbar navbar-dark d-lg-none sticky-top shadow-sm px-3 mobile-navbar">
<span class="navbar-brand mb-0 h1"><i class="bi bi-box-seam me-1"></i>KSC Logistics</span>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mobileMenu" aria-controls="mobileMenu" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
</nav>
<div class="collapse text-white d-lg-none shadow-sm" id="mobileMenu">
<div class="p-3">
<a class="d-block mb-2 p-3 text-white text-decoration-none rounded {% if request.endpoint == 'main.dashboard' %}bg-secondary{% endif %}" href="{{ url_for('main.dashboard') }}"><i class="bi bi-house-door me-2"></i>Dashboard</a>
<a class="d-block mb-2 p-3 text-white text-decoration-none rounded {% if request.endpoint == 'main.schedule' %}bg-secondary{% endif %}" href="{{ url_for('main.schedule') }}"><i class="bi bi-calendar-plus me-2"></i>Schedule Pickup</a>
<a class="d-block mb-2 p-3 text-white text-decoration-none rounded {% if request.endpoint == 'main.my_packages' %}bg-secondary{% endif %}" href="{{ url_for('main.my_packages') }}"><i class="bi bi-box-seam me-2"></i>My Packages</a>
<a class="d-block mb-2 p-3 text-white text-decoration-none rounded {% if request.endpoint == 'main.track' %}bg-secondary{% endif %}" href="{{ url_for('main.track') }}"><i class="bi bi-truck me-2"></i>Track Shipment</a>
<a class="d-block mb-3 p-3 text-white text-decoration-none rounded {% if request.endpoint == 'main.customer_analytics' %}bg-secondary{% endif %}" href="{{ url_for('main.customer_analytics') }}"><i class="bi bi-bar-chart me-2"></i>Analytics</a>
<hr class="border-light">
<button type="button" onclick="window.location.reload();" class="btn btn-warning btn-lg w-100 mb-3"><i class="bi bi-arrow-clockwise me-2"></i>Refresh</button>
<a class="btn btn-danger btn-lg w-100" href="{{ url_for('main.logout') }}"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
</div>
</div>
<main class="customer-main">
{% block customer_content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded",function(){
try{
const customerSocket=io("/customer",{transports:["polling"]});
customerSocket.on("connect",function(){console.log("Customer connected:",customerSocket.id);});
customerSocket.on("disconnect",function(){console.log("Customer disconnected");});
}catch(error){console.error("Customer Socket.IO error:",error);}
});
</script>
</body>
</html>
