{% extends "admin/base_admin.html" %}

{% block title %}Admin Packages{% endblock %}

{% block admin_content %}

<div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

    <div>
        <h2 class="mb-1">Active Packages</h2>
        <p class="text-muted mb-0">
            Manage active deliveries, schedules, statuses, and expected delivery dates
        </p>
    </div>

    <div class="d-flex flex-wrap gap-2">

        <!-- ARCHIVE DELIVERED -->
        <form method="POST"
              action="{{ url_for('main.admin_archive_delivered') }}"
              onsubmit="return confirm('Archive all delivered packages?');">

            <button type="submit" class="btn btn-success">
                Archive Delivered
            </button>

        </form>

        <!-- VIEW ARCHIVED -->
        <a href="{{ url_for('main.admin_archived_packages') }}"
           class="btn btn-secondary">
            View Archived
        </a>

        <!-- CLEAR ALL -->
        <form method="POST"
              action="{{ url_for('main.admin_clear_packages') }}"
              onsubmit="return confirm('⚠️ This will permanently delete ALL packages. Continue?');">

            <button type="submit" class="btn btn-danger">
                Clear All
            </button>

        </form>

    </div>

</div>

<!-- SEARCH -->
<div class="card shadow-sm border-0 mb-4">

    <div class="card-body">

        <input type="text"
               id="package-search"
               class="form-control"
               placeholder="Search tracking number, customer, phone, description, or status..."
               autocomplete="off">

    </div>

</div>

<!-- PACKAGES -->
<div class="card shadow-sm border-0">

    <div class="card-body p-0">

        {% include "partials/admin_packages_table.html" %}

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const searchInput = document.getElementById("package-search");
    const tableBody = document.getElementById("packages-table-body");

    if (!searchInput || !tableBody) {
        return;
    }

    searchInput.addEventListener("input", function () {

        const searchTerm = this.value.toLowerCase().trim();
        const rows = tableBody.querySelectorAll(".package-row");

        rows.forEach(function (row) {

            const rowText = row.textContent.toLowerCase();

            if (rowText.includes(searchTerm)) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }

        });

    });

});
</script>

{% endblock %}
